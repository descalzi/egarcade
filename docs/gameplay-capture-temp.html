<!doctype html><html lang="en"><meta charset="utf-8"><title>High Street screenshot capture</title>
<style>body{margin:0;background:#17172b;color:#fff1dd}p{margin:8px}img{display:block;width:960px;height:540px;image-rendering:pixelated}</style>
<p id="status" role="status">Rendering a gameplay frame…</p><img id="capture" alt="George outside Emma and Lou Interiors on the High Street" hidden>
<iframe src="./play/" title="Game renderer" hidden></iframe>
<script>
const frame=document.querySelector('iframe');
frame.addEventListener('load',()=>{
 const game=frame.contentWindow;
 const status=document.querySelector('#status');
 const capture=document.querySelector('#capture');
 const ready=setInterval(()=>{
  try {
   if(!game.eval('ready'))return;
   clearInterval(ready);
   game.eval(`choose('teal');
     enterSection(1,4,500,0);
     Object.assign(state.hero,{x:246,y:228,face:1});
     Object.assign(state.enemies[0],{x:304,y:232,rise:.47});
     drawEncounter(ctx,state);`);
   capture.src=game.document.querySelector('canvas#screen').toDataURL('image/png');
   capture.hidden=false;
   status.textContent='Emma & Lou Interiors';
  }catch(err){
   clearInterval(ready);
   status.textContent=String(err);
  }
 },100);
});
</script></html>
