<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17172b">
<meta name="description" content="Play the Benchy Cafe encounter from Grinstead Arcade: The Big Reveal.">
<title>The Big Reveal | Grinstead Arcade</title>
<style>
@layer tokens, base, game;
@layer tokens {
  :root {
    color-scheme: dark;
    --bg: #17172b; --surface: #22243d; --border: #393b57;
    --control: #8889aa; --fg: #fff1dd; --muted: #c9bfd7;
    --accent: #ffd08a; --on-accent: #281c25; --mint: #9ae0cd;
    --gutter: clamp(16px, 4vw, 48px); --ease: cubic-bezier(.16,1,.3,1);
    scrollbar-color: var(--control) var(--bg); accent-color: var(--accent);
    caret-color: var(--accent);
  }
}
@layer base {
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
    font: 1rem/1.5 system-ui, sans-serif; }
  h1, p, dl, dd { margin: 0; }
  a { color: var(--accent); text-underline-offset: .2em; }
  a:hover { text-decoration-thickness: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--control);
    border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit;
    font-weight: 650; cursor: pointer; touch-action: manipulation; }
  button:hover:not(:disabled) { background: #353653; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  [hidden] { display: none !important; }
}
@layer game {
  .wrap { width: min(calc(100% - 2 * var(--gutter)), 1060px); margin-inline: auto; }
  .skip { position: absolute; inset: 12px auto auto 12px; padding: 8px; z-index: 2;
    background: var(--bg); transform: translateY(-160%); }
  .skip:focus { transform: none; }
  header { border-bottom: 1px solid var(--border); }
  header .wrap { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header strong { font-size: 1.0625rem; }
  header a { color: var(--muted); font-size: .875rem; }
  main { padding-block: clamp(16px, 3vw, 32px) 32px; }
  .title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 20px; margin-bottom: 16px; }
  h1 { font: 700 clamp(2rem, 5vw, 3.75rem)/1.03 Georgia, serif; letter-spacing: -.035em; text-wrap: balance; }
  .location, .quiet { color: var(--muted); }
  .screen { background: var(--surface); border: 1px solid var(--border); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; }
  .deck { padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  fieldset { border: 0; padding: 0; margin: 0; }
  .heroes, .actions, #touch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px; min-height: 44px; }
  .hero:has(input:checked) { color: var(--fg); box-shadow: inset 0 -2px var(--accent); }
  .hero input { margin: 0; width: 16px; height: 16px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .primary:hover:not(:disabled) { background: #ffe1ad; }
  .status { min-height: 1.5em; margin-block: 12px; color: var(--muted); }
  .status[data-clear=true] { color: var(--mint); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 24px; border-top: 1px solid var(--border); padding-top: 12px; color: var(--muted); }
  .controls div { display: flex; gap: 8px; align-items: baseline; }
  .controls dt { color: var(--fg); }
  kbd { font: 0.875rem ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #touch { touch-action: none; justify-content: space-between; padding: 0 12px 12px; }
  #touch button { min-width: 44px; padding-inline: 8px; touch-action: none; }
  #touch button[data-held=true] { background: var(--accent); color: var(--on-accent); }
  .touch-group { display: flex; gap: 8px; }
  .touch-group svg { display: block; width: 18px; height: 18px; margin: auto; }
  @media (pointer: fine) { #touch { display: none; } }
  @media (max-width: 440px) { .deck { padding: 8px; gap: 8px; } #touch { padding-inline: 8px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
}
</style>
</head>
<body>
<a class="skip" href="#game">Skip to game</a>
<header><div class="wrap"><strong>Grinstead Arcade</strong><a href="https://github.com/descalzi/egarcade/blob/main/GAME_PLAN.md">Game plan</a></div></header>
<main class="wrap" id="game" tabindex="-1">
  <div class="title"><h1>The Big Reveal</h1><p class="location">Benchy Cafe encounter</p></div>
  <div class="screen">
    <canvas id="screen" tabindex="-1" width="480" height="270" role="img"
      aria-label="The Benchy Cafe and Book Nook at dusk.">This game requires a browser with Canvas support.</canvas>
    <div class="deck">
      <fieldset class="heroes" aria-label="Choose your hero">
        <label class="hero"><input type="radio" name="hero" value="rust" checked>Rust</label>
        <label class="hero"><input type="radio" name="hero" value="teal">Teal</label>
      </fieldset>
      <div class="actions">
        <button id="play" class="primary" disabled>Play encounter</button>
        <button id="pause" hidden>Pause</button>
        <button id="style" hidden>Back to title</button>
        <button id="save" disabled>Save style frame</button>
      </div>
    </div>
    <div id="touch" aria-label="Touch controls" hidden>
      <div class="touch-group">
        <button data-key="ArrowLeft" aria-label="Move left"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4l-8 8 8 8"/></svg></button>
        <button data-key="ArrowUp" aria-label="Move up"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l8-8 8 8"/></svg></button>
        <button data-key="ArrowDown" aria-label="Move down"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9l8 8 8-8"/></svg></button>
        <button data-key="ArrowRight" aria-label="Move right"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4l8 8-8 8"/></svg></button>
      </div>
      <div class="touch-group"><button data-key="Space">Jump</button><button data-key="KeyJ">Attack</button></div>
    </div>
  </div>
  <p id="status" class="status" role="status">Loading the encounter…</p>
  <noscript>Enable JavaScript to play the encounter.</noscript>
  <dl class="controls" aria-label="Keyboard controls">
    <div><dt>Move</dt><dd><kbd>Arrows / WASD</kbd></dd></div>
    <div><dt>Jump</dt><dd><kbd>Space</kbd></dd></div>
    <div><dt>Attack</dt><dd><kbd>J / X</kbd> · jump-kick in air</dd></div>
    <div><dt>Pause</dt><dd><kbd>Esc</kbd></dd></div>
    <div><dt>Restart</dt><dd><kbd>R</kbd></dd></div>
  </dl>
</main>
<script>
const screen = document.querySelector('#screen');
const ctx = screen.getContext('2d');
ctx.imageSmoothingEnabled = false;

function box(g, x, y, w, h, colour) {
  g.fillStyle = colour;
  g.fillRect(Math.round(x), Math.round(y), w, h);
}
function shape(g, points, colour) {
  g.fillStyle = colour;
  g.beginPath();
  points.forEach(([x, y], index) => index ? g.lineTo(x, y) : g.moveTo(x, y));
  g.closePath();
  g.fill();
}
function label(g, value, x, y, size, colour) {
  g.fillStyle = colour;
  g.font = 'bold ' + size + 'px monospace';
  g.fillText(value, x, y);
}
const heroFrames = {idle:0, walk:1, punch:2, kick:3};

function actor(g, actor, pose='idle', tick=0){
  const zombie=actor.look==='zombie';
  const wobble=pose==='walk'&&Math.floor(tick*9)%2?2:0;
  box(g,actor.x-13,actor.y-2,26,4,'#4e414e');
  g.save();
  g.translate(Math.round(actor.x),Math.round(actor.y-(actor.z||0)));
  g.scale(actor.face,1);
  if(zombie){
    if(actor.fall){
      g.translate(-22,0);
      g.rotate(-Math.PI/2);
    }else if(actor.tell){
      g.translate(-4,0);
    }
    g.drawImage(shopper,-18,-56-wobble);
  }else{
    const row=actor.look==='rust'?0:60;
    const forward=pose==='punch'||pose==='kick'?10:0;
    g.drawImage(heroPoses,heroFrames[pose]*76,row,76,60,-38+forward,-60-wobble,76,60);
  }
  g.restore();
}

function gift(g,x,y, gold=false) {
  box(g,x-6,y-10,12,10,gold?'#d69440':'#aa4e56');
  box(g,x-7,y-11,14,3,gold?'#e9b65c':'#d66b6a');
  box(g,x-1,y-12,2,12,'#ffe6a1'); box(g,x-4,y-14,8,2,'#f6be70');
}
function pie(g,x,y) {
  box(g,x-6,y-4,12,4,'#9b573c');box(g,x-5,y-7,10,4,'#edb46c');
  box(g,x-1,y-8,2,4,'#fff0ba');
}
function crate(g,x,y) {
  box(g,x-11,y-22,22,22,'#48343b');box(g,x-9,y-20,18,18,'#a46e48');
  box(g,x-7,y-17,14,2,'#d09860');box(g,x-7,y-8,14,2,'#694836');
  shape(g,[[x-8,y-3],[x-8,y-6],[x+8,y-19],[x+8,y-15]],'#e1a56a');
}
const controls = new Map([
  ['ArrowLeft','left'],['KeyA','left'],['ArrowRight','right'],['KeyD','right'],
  ['ArrowUp','up'],['KeyW','up'],['ArrowDown','down'],['KeyS','down'],
  ['Space','jump'],['KeyJ','attack'],['KeyX','attack'],['KeyR','restart']
]);
const held = new Set();
const pressed = new Set();
let mode = 'style';
let state;
let clock = 0;
let lastFrame;
const status = document.querySelector('#status');
const playButton = document.querySelector('#play');
const pauseButton = document.querySelector('#pause');
const titleButton = document.querySelector('#style');
const saveStyle = document.querySelector('#save');
const touch = document.querySelector('#touch');
const heroInputs = [...document.querySelectorAll('input[name=hero]')];
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const assetLoads = [];
let paused = false;
let ready = false;
function loadImage(source){
  const image=new Image();
  assetLoads.push(new Promise((resolve,reject)=>{
    image.addEventListener('load',resolve,{once:true});
    image.addEventListener('error',reject,{once:true});
  }));
  image.src=source;
  return image;
}

function zombieAt(x,y,face){
  return {look:'zombie',x,y,face,hp:4,stun:0,tell:0,recover:0,fall:0};
}
function newEncounter(look){
  return {
    hero:{look,x:62,y:224,z:0,vz:0,face:1,hearts:5,immune:0,
      swing:0,combo:0,comboTime:0,kicked:false,pose:'idle'},
    enemies:[zombieAt(346,228,-1)],
    gifts:[{x:96,y:223,height:0},{x:200,y:199,height:23,gold:true}],
    crate:{x:141,y:237,intact:true},
    pie:{x:275,y:207,taken:false},
    effects:[],wave:1,score:0,cleared:false
  };
}
function effect(s,kind,x,y){
  s.effects.push({kind,x,y,age:0,duration:kind==='hit'?.15:.32});
}
function clearInput(){
  held.clear();
  pressed.clear();
  for(const key of touch.querySelectorAll('[data-key]'))delete key.dataset.held;
}
function choose(next){
  clearInput();
  mode=next;
  paused=false;
  state=mode==='style'?null:newEncounter(mode);
  screen.setAttribute('aria-label',state?'Playable pavement outside Benchy Cafe.':'The Benchy Cafe and Book Nook at dusk.');
  touch.hidden=!state;
  pauseButton.hidden=!state;
  pauseButton.textContent='Pause';
  titleButton.hidden=!state;
  saveStyle.hidden=!!state;
  for(const input of heroInputs)input.disabled=!!state;
  playButton.textContent=state?'Restart':'Play encounter';
  status.dataset.clear='false';
  status.textContent=state?'Defeat the shopper zombie. Presents are optional.':'Choose Rust or Teal, then play.';
}
function setPaused(next){
  if(!state||paused===next)return;
  paused=next;
  clearInput();
  pauseButton.textContent=paused?'Resume':'Pause';
  touch.hidden=paused;
}
function press(code){
  if(!held.has(code))pressed.add(controls.get(code));
  held.add(code);
}
function down(action){
  return [...held].some(code=>controls.get(code)===action);
}
window.addEventListener('keydown',event=>{
  if(!state||event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.code==='Escape'){
    event.preventDefault();
    if(!event.repeat)setPaused(!paused);
    return;
  }
  if(paused||!controls.has(event.code))return;
  if(event.target.closest?.('input, button, a')&&event.code!=='KeyR')return;
  event.preventDefault();
  press(event.code);
});
window.addEventListener('keyup',event=>held.delete(event.code));
window.addEventListener('blur',()=>setPaused(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
for(const button of touch.querySelectorAll('[data-key]')){
  button.addEventListener('pointerdown',event=>{
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    button.dataset.held='true';
    press(button.dataset.key);
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture'])
    button.addEventListener(type,()=>{
      delete button.dataset.held;
      held.delete(button.dataset.key);
    });
}
playButton.addEventListener('click',()=>{
  choose(state?mode:heroInputs.find(input=>input.checked).value);
  screen.focus({preventScroll:true});
});
pauseButton.addEventListener('click',()=>{
  setPaused(!paused);
  if(!paused)screen.focus({preventScroll:true});
});
titleButton.addEventListener('click',()=>{
  choose('style');
  playButton.focus({preventScroll:true});
});
saveStyle.addEventListener('click',()=>{
  const link=document.createElement('a');
  link.href=styleFrame.src;
  link.download='benchy-cafe-style-frame.png';
  link.click();
});

const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const close=(a,b,x,y)=>Math.abs(a.x-b.x)<x&&Math.abs(a.y-b.y)<y;
function strike(s, air) {
  const h=s.hero;
  const reach=air?39:h.combo===3?36:30;
  const inArc=target=>close(h,target,reach,13)&&(target.x-h.x)*h.face>=-4;
  if(s.crate.intact&&inArc(s.crate)&&h.z<27){
    s.crate.intact=false;
    effect(s,'break',s.crate.x,s.crate.y-12);
    s.gifts.push({x:s.crate.x+10*h.face,y:s.crate.y,height:0});
  }
  for(const zombie of s.enemies){
    if(zombie.hp<=0||!inArc(zombie)||h.z>43)continue;
    effect(s,'hit',zombie.x,zombie.y-33);
    zombie.hp-=air||h.combo===3?2:1;
    zombie.stun=.24;
    zombie.tell=0;
    zombie.x=clamp(zombie.x+(air?17:7)*h.face,18,462);
    if(zombie.hp<=0)zombie.fall=.48;
  }
}
function update(dt) {
  if(!state||paused)return;
  if(pressed.has('restart')){
    choose(mode);
    return;
  }
  const s=state;
  const h=s.hero;
  for(const spark of s.effects)spark.age+=dt;
  s.effects=s.effects.filter(spark=>spark.age<spark.duration);
  h.immune=Math.max(0,h.immune-dt);
  h.swing=Math.max(0,h.swing-dt);
  h.comboTime=Math.max(0,h.comboTime-dt);
  const dx=Number(down('right'))-Number(down('left'));
  const dy=Number(down('down'))-Number(down('up'));
  if(dx)h.face=Math.sign(dx);
  const diagonal=dx&&dy?Math.SQRT1_2:1;
  h.x=clamp(h.x+dx*105*dt*diagonal,16,464);
  h.y=clamp(h.y+dy*69*dt*diagonal,189,253);
  h.pose=dx||dy?'walk':'idle';
  if(pressed.has('jump')&&h.z===0){
    h.vz=185;
    h.kicked=false;
  }
  if(h.vz||h.z){
    const previous=h.z;
    h.z=Math.max(0,h.z+h.vz*dt-270*dt*dt);
    h.vz=h.z?h.vz-540*dt:0;
    if(previous>0&&h.z===0)h.kicked=false;
  }
  const air=h.z>0;
  if(pressed.has('attack')&&h.swing<=0&&(!air||!h.kicked)){
    h.combo=air?0:h.comboTime>0?h.combo%3+1:1;
    h.comboTime=air?0:.55;
    h.swing=.17;
    h.attackPose=air||h.combo===3?'kick':'punch';
    h.kicked=air;
    strike(s,air);
  }
  if(h.swing)h.pose=h.attackPose;
  for(const z of s.enemies){
    if(z.hp<=0){
      z.fall=Math.max(0,z.fall-dt);
      continue;
    }
    z.stun=Math.max(0,z.stun-dt);
    z.recover=Math.max(0,z.recover-dt);
    if(z.stun||z.recover||(s.wave===1&&Math.abs(z.x-h.x)>165))continue;
    z.face=z.x<h.x?1:-1;
    if(z.tell>0){
      z.tell-=dt;
      if(z.tell<=0){
        z.tell=0;
        z.recover=.55;
        if(close(z,h,25,10)&&h.z<13&&!h.immune){
          effect(s,'hit',h.x,h.y-32);
          h.hearts--;
          h.immune=.85;
          if(h.hearts===0){
            choose(mode);
            status.textContent='Back at Benchy Cafe with five hearts. Step aside when a zombie shows its attack cue.';
            return;
          }
        }
      }
    }else if(close(z,h,22,9)){
      z.tell=.42;
    }else{
      z.x+=clamp(h.x-z.x,-42*dt,42*dt);
      z.y+=clamp(h.y-z.y,-28*dt,28*dt);
    }
  }
  for(const item of s.gifts){
    if(!item.taken&&close(h,item,12,9)&&h.z>=item.height&&h.z<item.height+15){
      item.taken=true;
      s.score+=item.gold?300:100;
    }
  }
  if(!s.pie.taken&&h.hearts<5&&h.z<10&&close(h,s.pie,12,9)){
    h.hearts++;
    s.pie.taken=true;
  }
  if(!s.cleared&&s.enemies.every(z=>z.hp<=0&&!z.fall)){
    if(s.wave===1){
      s.wave=2;
      s.enemies=[zombieAt(16,240,1),zombieAt(464,221,-1)];
      status.textContent='Two more shoppers. Watch both ends of the street.';
    }else{
      s.cleared=true;
      status.dataset.clear='true';
      status.textContent='Street clear. Collect any remaining presents or play again.';
      playButton.textContent='Play again';
    }
  }
}
function scene(g){
  g.drawImage(background,0,0,480,270);
  box(g,185,181,29,5,'#aa8175');box(g,185,186,29,13,'#72515b');
  box(g,187,188,25,1,'#936b69');
}
function hud(g, hearts, score){
  box(g,6,5,109,17,'#24263a');
  for(let i=0;i<5;i++){
    const x=11+i*13;
    shape(g,[[x,10],[x+3,8],[x+6,10],[x+9,8],[x+12,10],[x+12,13],[x+6,18],[x,13]],i<hearts?'#e47470':'#635262');
  }
  label(g,String(score).padStart(3,'0'),80,17,9,'#ffe3a8');
}
function drawStyle(g){
  if(styleFrame.complete&&styleFrame.naturalWidth)g.drawImage(styleFrame,0,0);
}
function drawEncounter(g,s){
  scene(g);
  if(s.crate.intact)crate(g,s.crate.x,s.crate.y);
  if(!s.pie.taken)pie(g,s.pie.x,s.pie.y);
  for(const item of s.gifts)
    if(!item.taken)gift(g,item.x,item.y-item.height,item.gold);
  for(const a of [s.hero,...s.enemies].sort((a,b)=>a.y-b.y)){
    if(a.hp<=0&&!a.fall)continue;
    if(!reducedMotion.matches&&(a.immune&&Math.floor(clock*4)%2||a.fall&&Math.floor(clock*4)%2))continue;
    actor(g,a,a.pose||(a.tell?'punch':'walk'),clock);
    if(a.tell)label(g,'!',a.x-2,a.y-64,12,'#ffcf76');
  }
  for(const spark of s.effects){
    const burst=spark.kind==='break';
    const cell=burst?48:31;
    const height=burst?48:32;
    const count=burst?5:3;
    const frame=burst?3+Math.min(count-1,Math.floor(spark.age/spark.duration*count)):Math.min(count-1,Math.floor(spark.age/spark.duration*count));
    g.drawImage(burst?breakBurst:hitFlash,frame*cell,0,cell,height,
      Math.round(spark.x-cell/2),Math.round(spark.y-height/2),cell,height);
  }
  hud(g,s.hero.hearts,s.score);
  if(paused){
    box(g,183,117,114,31,'#22243d');
    label(g,'Paused',216,137,13,'#fff1dd');
  }
}
function frame(now){
  const dt=lastFrame===undefined?0:Math.min(.035,(now-lastFrame)/1000);
  lastFrame=now;
  if(!paused)clock+=dt;
  update(dt);
  pressed.clear();
  if(state&&ready)drawEncounter(ctx,state);
  else drawStyle(ctx);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
